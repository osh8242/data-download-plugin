name: Publish Plugin to JetBrains Marketplace

on:
  push:
    tags:
      - 'v*' # v1.0.0, v1.0.1 등 v로 시작하는 태그가 푸시될 때만 작동함

jobs:
  publish:
    name: Publish Plugin
    runs-on: ubuntu-latest
    steps:
      # 1) 저장소 소스코드 내려받기
      - name: Fetch Sources
        uses: actions/checkout@v4

      # 2) 빌드에 필요한 JDK 17 환경 구축
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'

      # 3) 빌드 속도 단축을 위한 Gradle 캐싱 적용
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4) 토큰을 주입하여 빌드 및 마켓플레이스 배포 수행
      - name: Publish Plugin to Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: ./gradlew publishPlugin --token "$PUBLISH_TOKEN"
